      # - "15672:15672"
    # networks:
      # - payit
    # deploy:
      # resources:
        # limits:
          # cpus: '1'
          # memory: 2G
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: "ledger_db"
    networks:
       - payit  
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:        
        limits:
          cpus: '1'
          memory: 2G  
  kafka1:
    image: bitnami/kafka:4.1.0
    container_name: kafka1
    ports:
      - "9092:9092"   # EXTERNAL for client
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9091,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka1:9091,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLIENT_USERS=admin
      - KAFKA_CLIENT_PASSWORDS=admin-secret
      - KAFKA_INTER_BROKER_USER=broker
      - KAFKA_INTER_BROKER_PASSWORD=broker-secret
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_ENABLE_AUTO_COMMIT=false
      - KAFKA_CFG_LOG_RETENTION_MS=120000
      - KAFKA_LOGS_MAX_FILESIZE=10485760
      - KAFKA_LOGS_MAX_BACKUPS=2
    volumes:
      - kafka1_data:/bitnami/kafka
    networks:
      - payit
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G  
    
  kafka2:
    image: bitnami/kafka:4.1.0
    container_name: kafka2
    ports:
      - "9093:9092"
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=2
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9091,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka2:9091,EXTERNAL://localhost:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLIENT_USERS=admin
      - KAFKA_CLIENT_PASSWORDS=admin-secret
      - KAFKA_INTER_BROKER_USER=broker
      - KAFKA_INTER_BROKER_PASSWORD=broker-secret
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_ENABLE_AUTO_COMMIT=false
      - KAFKA_CFG_LOG_RETENTION_MS=120000
      - KAFKA_LOGS_MAX_FILESIZE=10485760
      - KAFKA_LOGS_MAX_BACKUPS=2
    volumes:
      - kafka2_data:/bitnami/kafka
    networks:
      - payit
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G    

  kafka3:
    image: bitnami/kafka:4.1.0
    container_name: kafka3
    ports:
      - "9094:9092"   # EXTERNAL for client
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=3
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
      - KAFKA_CFG_LISTENERS=INTERNAL://:9091,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka3:9091,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CFG_SECURITY_INTER_BROKER_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLIENT_USERS=admin
      - KAFKA_CLIENT_PASSWORDS=admin-secret
      - KAFKA_INTER_BROKER_USER=broker
      - KAFKA_INTER_BROKER_PASSWORD=broker-secret
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_ENABLE_AUTO_COMMIT=false
      - KAFKA_CFG_LOG_RETENTION_MS=120000
      - KAFKA_LOGS_MAX_FILESIZE=10485760
      - KAFKA_LOGS_MAX_BACKUPS=2
    volumes:
      - kafka3_data:/bitnami/kafka  
    networks:
      - payit
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G          
networks:
  payit:
    name: payit
    driver: bridge      
volumes:
  rabbitmq-data:
  volumes:
  postgres_data:
  kafka1_data:
  kafka2_data:  
  kafka3_data: