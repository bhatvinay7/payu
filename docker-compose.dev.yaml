  # rabbitmq:
    # container_name: rabbitmq
    # image: "rabbitmq:3-management"
    # environment:
      # RABBITMQ_DEFAULT_USER: inbox_user
      # RABBITMQ_DEFAULT_PASS: inbox_password
    # volumes:
      # - rabbitmq-data:/var/lib/rabbitmq
    # ports:
