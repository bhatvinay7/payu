  outbox-worker:
    container_name: service-worker
    build:
      context: .
      dockerfile: apps/outbox-worker/dockerfile.dev.yaml
    ports:
      - "3006:3006"
    env_file:
      -  ./apps/outbox-worker/.env
    networks:
      - payit
    depends_on:
      - kafka1
      - kafka2  
      - kafka3
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.25'
